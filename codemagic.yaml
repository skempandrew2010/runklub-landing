workflows:
  ios-app-store:
    name: iOS App Store
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: fit.runklub.app
      node: latest
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
      - name: Upload to TestFlight
        script: |
          python3 -c "
          import os
          key = os.environ.get('APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY', '')
          key = key.replace('\\\\n', '\\n')
          with open('/tmp/asc_key.p8', 'w') as f:
              f.write(key)
          "
          app-store-connect publish \
            --path build/ios/ipa/App.ipa \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key @file:/tmp/asc_key.p8 \
            --testflight
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
